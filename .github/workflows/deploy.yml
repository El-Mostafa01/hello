name: Deploy iOS-Glass to GitHub Pages

# Builds the Vite app and publishes dist/ to GitHub Pages over HTTPS.
on:
  push:
    branches:
      - main
      - claude/android-ios-theme-pixel-8hkrcg
  workflow_dispatch: {}

# Permissions the GITHUB_TOKEN needs to publish Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; newer pushes cancel in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure Pages (auto-enable if needed)
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # Use the base path GitHub Pages assigns (e.g. "/hello/") so all
      # asset, manifest, and service-worker URLs resolve correctly.
      - name: Build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npx vite build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
